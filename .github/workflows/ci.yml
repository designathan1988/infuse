name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./...
      - name: build (windows)
        run: GOOS=windows CGO_ENABLED=0 go build ./...
      - name: build (linux, no cgo)
        run: CGO_ENABLED=0 GOOS=linux go build ./...
      - name: build (macOS, no cgo)
        run: CGO_ENABLED=0 GOOS=darwin go build ./...
      - name: frontend syntax
        run: |
          for f in $(find ui -name '*.js' -not -path '*/vendor/*'); do node --check "$f"; done
      - name: locale data
        run: node -e "JSON.parse(require('fs').readFileSync('internal/core/catalog.json','utf8'))"
