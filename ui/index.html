<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>infuse</title>
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg:#fafafa; --sb:#f3f3f4; --surface:#ffffff; --s2:#f1f1f2; --s3:#e9e9eb; --border:#e6e6e8; --border2:#d6d6da;

  }
  :root.dark {

    --text:#ececee; --text2:#a3a3ab; --text3:#6f6f78; --accent:#86a3f2; --accent-soft:#232b3f;
    --ok:#7fd196; --ok-soft:#1d2f23; --warn:#e2b55b; --warn-soft:#342a14; --bad:#f09397; --bad-soft:#3a1f21;
    --add:#1b3324; --add-t:#9ad9ad; --del:#3a2224; --del-t:#f0a3a6; --user:#26272c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box } html, body { height:100% }
  body { margin:0; font:13.5px/1.55 var(--sans); color:var(--text); background:var(--bg); display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-font-smoothing:antialiased }

  .btn { border-radius:6px; padding:5px 11px; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text2); transition:background .1s, color .1s }
  .btn:hover { background:var(--s3); color:var(--text) } .btn.pri { background:var(--text); color:var(--bg) } .btn.pri:hover { opacity:.88 }

  .btn.outline { box-shadow:inset 0 0 0 1px var(--border2) }

  .kbd { font-family:var(--sans); font-size:10.5px; color:var(--text3); border:1px solid var(--border2); border-radius:4px; padding:0 4px; line-height:15px }
  .tag { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--s2); color:var(--text2) }
  .tag.ok { background:var(--ok-soft); color:var(--ok) } .tag.bad { background:var(--bad-soft); color:var(--bad) } .tag.warn { background:var(--warn-soft); color:var(--warn) }
  .row { display:flex; align-items:center; gap:8px } .grow { flex:1; min-width:0 } .trunc { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .scroll { overflow:auto; min-height:0 }
  ::-webkit-scrollbar { width:10px; height:10px } ::-webkit-scrollbar-thumb { background:transparent; border-radius:6px; border:3px solid transparent; background-clip:padding-box } :hover::-webkit-scrollbar-thumb, .scroll:hover::-webkit-scrollbar-thumb { background:var(--border2); background-clip:padding-box }
  a { color:var(--accent); text-decoration:none } a:hover { text-decoration:underline }

  /* frame */

  #app.panel { grid-template-columns:250px 1fr 440px } #app.nosb { grid-template-columns:0px 1fr 0px } #app.nosb.panel { grid-template-columns:0px 1fr 440px }
  #sidebar { background:var(--sb); display:flex; flex-direction:column; min-height:0; overflow:hidden }

  #panel { background:var(--sb); border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0; overflow:hidden }
  #foot { height:22px; display:flex; align-items:center; gap:14px; padding:0 12px; font-size:11px; color:var(--text3); flex:none; background:var(--sb) }
  #foot .dot { width:6px; height:6px; border-radius:50%; background:var(--border2) } #foot .dot.busy { background:var(--accent); animation:pulse 1.2s infinite } #foot .dot.wait { background:var(--warn) } #foot .dot.err { background:var(--bad) }
  @keyframes pulse { 50% { opacity:.25 } }

  /* sidebar */
  #sbTop { padding:12px 12px 4px; display:flex } #sbSearch { padding:4px 12px 6px }
  .newsess { width:100%; justify-content:flex-start; gap:8px; padding:7px 10px; color:var(--text); background:var(--surface); box-shadow:var(--shadow); border-radius:8px } .newsess:hover { background:var(--surface); box-shadow:var(--shadow), 0 0 0 1px var(--border2) }
  #search { width:100%; background:transparent; border-radius:6px; padding:5px 9px; font-size:12.5px; border:0 } #search:focus { background:var(--surface); box-shadow:0 0 0 1px var(--border2) }
  /* home: the composer sits in the middle with the project picker under it */

  .menu.show { display:block } .menu div { padding:7px 10px; border-radius:6px; cursor:pointer; font-size:12.5px; display:flex; gap:8px; align-items:center } .menu div:hover { background:var(--s2) } .menu div.on { color:var(--text) } .menu div .faint { margin-left:auto; max-width:180px }
  .menu hr { border:0; border-top:1px solid var(--border); margin:4px 0 } .menu .fslist { display:block; max-height:300px; overflow:auto; padding:0 } .menu .fslist:hover { background:transparent } .menu .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text3); padding:6px 10px 2px; cursor:default } .menu .lab:hover { background:transparent }

  .ws > .h:hover { color:var(--text) } .ws.active > .h { color:var(--text) } .ws .h .chev { width:10px; font-size:9px; transition:transform .12s } .ws.closed .h .chev { transform:rotate(-90deg) }
  .ws.closed .sess { display:none } .ws .h .path { display:none }
  .ws .h .plus { margin-left:auto; visibility:hidden; font-size:14px; line-height:1; color:var(--text3) } .ws .h:hover .plus { visibility:visible }
  .sess { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--text2); margin:1px 0 }
  .sess:hover { background:var(--s3); color:var(--text) } .sess.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow) }
  .sess .st { width:6px; height:6px; border-radius:50%; background:transparent; flex:none } .sess .st.busy { background:var(--accent); animation:pulse 1.2s infinite } .sess .st.wait { background:var(--warn) }
  .sess .faint { font-size:11px }
  .ws.dragover > .h, .sess.dragover { outline:1px dashed var(--accent) }

  #ctx div { padding:6px 12px; border-radius:5px; cursor:pointer; font-size:12.5px } #ctx div:hover { background:var(--s2) } #ctx div.danger:hover { color:var(--bad) } #ctx hr { border:0; border-top:1px solid var(--border); margin:4px 0 }

  #tabs .tab { display:flex; align-items:center; gap:8px; padding:0 12px; max-width:220px; border-radius:8px 8px 0 0; cursor:pointer; color:var(--text2); font-size:12.5px }
  #tabs .tab:hover { background:var(--s3) } #tabs .tab.active { background:var(--bg); color:var(--text) }
  #tabs .tab .x { opacity:0; width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; border-radius:4px; font-size:13px } #tabs .tab:hover .x, #tabs .tab.active .x { opacity:.55 } #tabs .tab .x:hover { opacity:1; background:var(--s3) }
  #tabs .sp { flex:1 } #tabs .tools { display:flex; align-items:center; gap:4px }

  .pill { border-radius:6px; padding:3px 8px; font-size:12px; display:inline-flex; gap:6px; align-items:center; cursor:pointer; color:var(--text2) } .pill:hover { background:var(--s2); color:var(--text) }
  .pill select { border:0; background:transparent; padding:0; font-size:12px; cursor:pointer; color:inherit }

  .u { background:var(--user); border-radius:14px; padding:12px 16px; white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.55 } .u .att { display:inline-block; margin-top:6px; font-size:12px; color:var(--text2) }
  .u img { max-width:220px; max-height:160px; border-radius:8px; display:block; margin-top:8px }
  .a { padding:2px 2px; word-break:break-word; font-size:14px; line-height:1.6 }
  .md p { margin:0 0 10px } .md > :last-child { margin-bottom:0 } .md pre { background:var(--s2); padding:10px 12px; border-radius:var(--r); overflow:auto; font-family:var(--mono); font-size:12.5px; margin:8px 0; line-height:1.5 }
  .md code { font-family:var(--mono); font-size:12.5px; background:var(--s2); padding:1px 5px; border-radius:4px } .md pre code { background:transparent; padding:0 }
  .md ul, .md ol { margin:4px 0 10px 22px; padding:0 } .md li { margin:2px 0 } .md h1,.md h2,.md h3 { font-size:14px; margin:14px 0 6px; font-weight:600 } .md table { border-collapse:collapse; margin:6px 0 } .md td, .md th { border:1px solid var(--border); padding:4px 10px }
  .think { color:var(--text3); font-size:12.5px; margin:2px 0 } .think summary { cursor:pointer; list-style:none; display:inline-flex; gap:6px; align-items:center } .think summary::-webkit-details-marker { display:none } .think summary::before { content:'›'; display:inline-block; transition:transform .12s } .think[open] summary::before { transform:rotate(90deg) }
  .think pre { white-space:pre-wrap; font-family:var(--sans); margin:6px 0 0 12px; border-left:2px solid var(--border); padding-left:12px; max-height:220px; overflow:auto; line-height:1.5 }
  .tool { margin:2px 0; font-size:12.5px; border-radius:var(--r) }
  .tool .h { display:flex; align-items:center; gap:10px; padding:5px 8px; cursor:pointer; min-height:28px; border-radius:var(--r); color:var(--text2) } .tool .h:hover { background:var(--s2) }
  .tool .h .ic { width:14px; text-align:center; color:var(--text3); font-size:11px; font-family:var(--mono) } .tool .h .n { font-weight:600; color:var(--text) } .tool .h .s { font-family:var(--mono); font-size:12px; color:var(--text2); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .tool .h .r { color:var(--text3); font-size:11px } .tool .h .r.bad { color:var(--bad) } .tool .h .r.ok { color:var(--ok) }
  .tool .b { display:none; margin:2px 0 6px 22px; border-left:2px solid var(--border); padding-left:10px } .tool.open .b { display:block }
  .tool .b .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text3); padding:6px 0 2px }
  .tool pre { margin:0; padding:2px 0 6px; white-space:pre-wrap; font-family:var(--mono); font-size:12px; max-height:380px; overflow:auto; line-height:1.5 }
  .tool .inf { color:var(--accent) }
  .diff { font-family:var(--mono); font-size:12px; white-space:pre; overflow:auto; max-height:380px; border-radius:6px; line-height:1.5 } .diff div { padding:0 8px; min-height:18px } .diff .add { background:var(--add); color:var(--add-t) } .diff .del { background:var(--del); color:var(--del-t) } .diff .hh { color:var(--text3) }
  .card { padding:12px 14px 12px 16px; border-radius:var(--r); background:var(--surface); box-shadow:var(--shadow); position:relative } .card::before { content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:3px; background:var(--border2) }
  .card.ask::before { background:var(--warn) } .card.q::before { background:var(--accent) }
  .card .acts { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; align-items:center } .card .acts .btn { box-shadow:inset 0 0 0 1px var(--border2) } .card .acts .btn.pri { box-shadow:none } .card .acts .kbd { margin-left:2px; opacity:.8 }
  .card pre.out { margin:8px 0 0 }
  .errbox { color:var(--bad); background:var(--bad-soft); border-radius:var(--r); padding:10px 14px; font-size:13px }
  #live .cursor { display:inline-block; width:7px; height:14px; background:var(--text2); vertical-align:-2px; animation:pulse .9s infinite; margin-left:1px }
  #status { display:flex; align-items:center; gap:8px; color:var(--text2); font-size:12.5px; padding:4px 2px } #status .sp { width:12px; height:12px; border:2px solid var(--border2); border-top-color:var(--text2); border-radius:50%; animation:spin .8s linear infinite } @keyframes spin { to { transform:rotate(360deg) } }
  .welcome { color:var(--text2); padding:14vh 10px 20px; text-align:center; font-size:13.5px } .welcome b { color:var(--text); font-size:17px; font-weight:600; display:block; margin-bottom:8px } .welcome .k { margin-top:22px; display:grid; grid-template-columns:auto auto; gap:6px 16px; justify-content:center; font-size:12.5px; text-align:left; color:var(--text3) } .welcome .k .kbd { justify-self:end }

  /* composer */
  #composer { flex:none; padding:6px 28px 12px; max-width:836px; width:100%; margin:0 auto }
  #box { border-radius:14px; background:var(--surface); display:flex; flex-direction:column; box-shadow:var(--shadow), 0 0 0 1px var(--border); transition:box-shadow .12s } #box:focus-within { box-shadow:var(--shadow), 0 0 0 1px var(--border2) }
  #box.vim { box-shadow:var(--shadow), 0 0 0 1px var(--warn) }
  #atts { display:flex; gap:6px; flex-wrap:wrap; padding:10px 12px 0 } #atts:empty { display:none }
  .chip { display:inline-flex; gap:6px; align-items:center; font-size:12px; background:var(--s2); border-radius:999px; padding:2px 10px } .chip b { cursor:pointer; color:var(--text3); font-weight:400 } .chip b:hover { color:var(--text) } .chip img { height:18px; border-radius:3px }
  #prompt { border:0; background:transparent; resize:none; width:100%; min-height:48px; max-height:280px; padding:13px 16px 4px; font-family:var(--sans); font-size:14px; line-height:1.5 } #prompt::placeholder { color:var(--text3) }
  #boxRow { display:flex; align-items:center; gap:4px; padding:2px 8px 8px 10px } #boxRow .sp { flex:1 }
  #btnSend { width:30px; height:30px; border-radius:8px; background:var(--text); color:var(--bg); display:inline-flex; align-items:center; justify-content:center; font-size:15px } #btnSend:hover { opacity:.85 } #btnSend .kbd, #btnSend .t { display:none }
  #btnStop { box-shadow:inset 0 0 0 1px var(--border2); color:var(--text) } #btnStop .kbd { display:none }
  #modePill.acceptEdits { color:var(--ok) } #modePill.plan { color:var(--accent) } #modePill.bypass { color:var(--bad) }
  #hint { font-size:11px; color:var(--text3); padding:6px 6px 0; display:flex; gap:16px; justify-content:center } #hint .kbd { border:0; padding:0; font-size:11px; color:var(--text3) }
  #ac { position:absolute; z-index:40; background:var(--surface); border-radius:10px; box-shadow:var(--shadow), 0 0 0 1px var(--border); max-height:260px; overflow:auto; min-width:340px; display:none; padding:4px }
  #ac div { padding:6px 10px; font-size:12.5px; display:flex; gap:10px; cursor:pointer; border-radius:6px } #ac div.on { background:var(--s2) } #ac div span { color:var(--text3); margin-left:auto; font-size:11.5px } #ac div .mono { color:var(--text) }

  /* right panel */
  #ptabs { display:flex; flex:none; overflow-x:auto; padding:8px 8px 0; gap:2px } #ptabs::-webkit-scrollbar { height:0 }
  #ptabs button { flex:none; padding:6px 9px; color:var(--text3); border-radius:6px; font-size:12px } #ptabs button:hover { color:var(--text) } #ptabs button.active { color:var(--text); background:var(--s3) }
  #ptabs .sp { flex:1 } #ptabs .x { color:var(--text3); padding:0 8px; font-size:15px }
  .pane { display:none; flex-direction:column; min-height:0; flex:1 } .pane.active { display:flex } .pane .body { padding:12px 14px; overflow:auto; flex:1; min-height:0 }
  table { width:100%; border-collapse:collapse; font-size:12px } th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--border); vertical-align:top } th { color:var(--text3); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px }
  .tree { font-family:var(--mono); font-size:12px } .tree .n { padding:2px 6px; border-radius:4px; cursor:pointer; white-space:nowrap; display:flex; gap:6px; color:var(--text2) } .tree .n:hover { background:var(--s3); color:var(--text) } .tree .n.d { color:var(--text) } .tree .c { margin-left:14px; display:none } .tree .open > .c { display:block } .tree .ln { color:var(--text3); margin-left:auto }
  .tree .n .st { font-size:10px; width:12px; color:var(--warn) }
  .frow { display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:4px; cursor:pointer; font-family:var(--mono); font-size:12px; color:var(--text2) } .frow:hover { background:var(--s3); color:var(--text) } .frow .st { width:14px; color:var(--warn); font-weight:600 } .frow .st.A, .frow .st.\? { color:var(--ok) } .frow .st.D { color:var(--bad) }
  .task { display:flex; gap:10px; align-items:flex-start; padding:6px 0; border-bottom:1px solid var(--border); font-size:12.5px } .task .st { font-size:10.5px; padding:1px 7px; border-radius:4px; background:var(--s3); flex:none; margin-top:2px; color:var(--text2) } .task.done { color:var(--text3) } .task.done .st { background:var(--ok-soft); color:var(--ok) } .task.in_progress .st { background:var(--accent-soft); color:var(--accent) }
  #term { font-family:var(--mono); font-size:12px; white-space:pre-wrap; flex:1; overflow:auto; padding:10px 14px; line-height:1.5 } #term .cmd { color:var(--accent) } #term .note { color:var(--text3) } #term .err { color:var(--bad) }
  #termRow { display:flex; gap:8px; align-items:center; padding:8px 14px; font-family:var(--mono); font-size:12px; border-top:1px solid var(--border) } #termRow input { flex:1; font-family:var(--mono); border:0 }
  .rule { display:grid; grid-template-columns:18px 86px 1fr 100px 1fr 20px; gap:6px; align-items:center; padding:3px 0; border-bottom:1px solid var(--border) } .rule input, .rule select { width:100%; font-size:12px; padding:2px 3px } .rule .x { color:var(--text3) } .rule .x:hover { color:var(--bad) }
  .inl { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12.5px; border-bottom:1px solid var(--border) } .inl label { color:var(--text2); min-width:150px } .inl input[type=text], .inl input[type=password], .inl input[type=number], .inl select { flex:1; min-width:0 } .inl input[type=number] { max-width:110px }

}

// slash commands
async function slash(text) {
  const [cmd, ...rest] = text.slice(1).split(/\s+/); const arg = rest.join(' ');
  const custom = S.commands.find(c => !c.builtin && c.name === cmd);
  if (custom) { P.value = custom.prompt.replace(/\$ARGUMENTS/g, arg); grow(); return false; /* send as prompt */ }
  switch (cmd) {
    case 'clear': await newSession(S.root); return true;
    case 'compact': toast('A compactação acontece automaticamente quando o contexto passa de 75%'); return true;
    case 'model': if (arg) $('#modelSel').value = arg, $('#modelSel').onchange({ target: $('#modelSel') }); else $('#modelSel').focus(); return true;
    case 'mode': if (modeOrder.includes(arg)) setMode(arg); else $('#modePill').click(); return true;
    case 'rewind': { const n = parseInt(arg) || cur()?.snap?.turn; if (n) rewind(n); return true; }
    case 'diff': showPane('git'); return true;
    case 'cost': { const L = cur(); toast(L ? `${fmtMoney(L.snap.cost)} · ${fmtTok((L.snap.usage?.input || 0) + (L.snap.usage?.cacheRead || 0))} entrada / ${fmtTok(L.snap.usage?.output || 0)} saída` : 'sem sessão'); return true; }
    case 'vim': await saveSetting({ vim: !S.settings.vim }); applyVim(); return true;
    case 'help': openPalette(); return true;

}

let acItems = [], acIdx = 0, acKind = '';

  const v = P.value, pos = P.selectionStart; const before = v.slice(0, pos);
  const m = before.match(/(^|\s)([@/])([^\s]*)$/);
  if (!m || (m[2] === '/' && before.trim() !== m[2] + m[3])) return hideAC();
  acKind = m[2]; const q = m[3].toLowerCase();
  if (acKind === '@') acItems = S.files.filter(f => f.toLowerCase().includes(q)).slice(0, 40).map(f => ({ v: f, d: f.endsWith('/') ? 'pasta' : '' }));
  else acItems = S.commands.filter(c => c.name.startsWith(q)).map(c => ({ v: c.name, d: c.description }));
  if (!acItems.length) return hideAC();
  acIdx = 0; renderAC();
}
function renderAC() { const ac = $('#ac'); ac.innerHTML = acItems.map((it, i) => `<div class="${i === acIdx ? 'on' : ''}" onmousedown="acPick(${i})"><span class="mono">${acKind}${esc(it.v)}</span><span>${esc(it.d || '')}</span></div>`).join(''); ac.style.display = 'block'; const r = $('#box').getBoundingClientRect(); ac.style.left = r.left + 'px'; ac.style.bottom = (innerHeight - r.top + 6) + 'px'; ac.children[acIdx]?.scrollIntoView({ block: 'nearest' }); }

// vim mode (minimal: normal/insert, hjkl, i a o A I x dd, Esc)
function applyVim() { S.vim = !!S.settings?.vim; $('#box').classList.toggle('vim', S.vim); $('#vimHint').style.display = S.vim ? '' : 'none'; S.vimMode = 'INSERT'; $('#vimMode').textContent = S.vimMode; }
function vimKey(e) {
  if (!S.vim) return false;
  if (S.vimMode === 'INSERT') { if (e.key === 'Escape' && $('#ac').style.display !== 'block') { S.vimMode = 'NORMAL'; $('#vimMode').textContent = 'NORMAL'; e.preventDefault(); return true; } return false; }
  e.preventDefault(); const v = P.value, p = P.selectionStart; const move = n => { P.selectionStart = P.selectionEnd = Math.max(0, Math.min(v.length, p + n)); };
  switch (e.key) {
    case 'h': move(-1); break; case 'l': move(1); break;
    case 'j': case 'k': { const lines = v.split('\n'); let acc = 0, li = 0, col = p; for (; li < lines.length; li++) { if (col <= lines[li].length) break; col -= lines[li].length + 1; } const t = li + (e.key === 'j' ? 1 : -1); if (t >= 0 && t < lines.length) { for (let i = 0; i < t; i++) acc += lines[i].length + 1; P.selectionStart = P.selectionEnd = acc + Math.min(col, lines[t].length); } break; }
    case 'i': S.vimMode = 'INSERT'; break; case 'a': move(1); S.vimMode = 'INSERT'; break;
    case 'A': P.selectionStart = P.selectionEnd = v.indexOf('\n', p) === -1 ? v.length : v.indexOf('\n', p); S.vimMode = 'INSERT'; break;
    case 'I': P.selectionStart = P.selectionEnd = v.lastIndexOf('\n', p - 1) + 1; S.vimMode = 'INSERT'; break;
    case 'o': { const e2 = v.indexOf('\n', p) === -1 ? v.length : v.indexOf('\n', p); P.value = v.slice(0, e2) + '\n' + v.slice(e2); P.selectionStart = P.selectionEnd = e2 + 1; S.vimMode = 'INSERT'; break; }
    case 'x': P.value = v.slice(0, p) + v.slice(p + 1); P.selectionStart = P.selectionEnd = p; break;
    case 'd': if (S.vimPending === 'd') { const s = v.lastIndexOf('\n', p - 1) + 1; let en = v.indexOf('\n', p); en = en === -1 ? v.length : en + 1; P.value = v.slice(0, s) + v.slice(en); P.selectionStart = P.selectionEnd = s; S.vimPending = ''; } else { S.vimPending = 'd'; return true; } break;
    case 'Enter': send(); break;
    case 'Escape': break;

const paneNames = { files: 'Arquivos', git: 'Git', tasks: 'Tarefas', term: 'Terminal', oracle: 'Pronto', rules: 'Regras', journal: 'Jornal', vices: 'Vícios', map: 'Mapa', config: 'Configurações' };
function showPane(p) { S.pane = p; localStorage.setItem('pane', p); if (!S.panelOpen) togglePanel(true); document.querySelectorAll('#ptabs button[data-pane]').forEach(b => b.classList.toggle('active', b.dataset.pane === p)); document.querySelectorAll('.pane').forEach(x => x.classList.toggle('active', x.id === 'pane-' + p)); renderPane(); }
function togglePanel(force) { S.panelOpen = force === true ? true : !S.panelOpen; localStorage.setItem('panel', S.panelOpen ? '1' : '0'); $('#app').classList.toggle('panel', S.panelOpen); }
document.querySelectorAll('[data-pane]').forEach(b => b.onclick = () => showPane(b.dataset.pane));
$('#btnPanel').onclick = () => togglePanel(); $('#btnClosePanel').onclick = () => togglePanel();
function renderPane() { if (!S.panelOpen) return; ({ files: loadTree, git: loadGit, tasks: renderTasks, term: renderTerm, oracle: loadOracle, rules: loadRules, journal: loadJournal, vices: loadVices, map: loadMap, config: renderConfig })[S.pane]?.(); }

// files
async function loadTree() {
  if (!S.root) { $('#tree').innerHTML = '<div class="empty">Sem projeto</div>'; return; }
  const [t, d] = await Promise.all([api('/api/files/tree'), api('/api/diff')]); const changed = {}; for (const f of d.files || []) changed[f.path] = f.status;
  const rec = (n, depth) => n.dir ? `<div class="${depth < 1 ? 'open' : ''}"><div class="n d" onclick="this.parentNode.classList.toggle('open')">${esc(n.name)}/</div><div class="c">${(n.children || []).map(c => rec(c, depth + 1)).join('')}</div></div>` : `<div class="n" onclick="openFile('${esc(n.path)}')"><span class="st">${changed[n.path] ? esc(changed[n.path]) : ''}</span>${esc(n.name)}<span class="ln">${n.lines || ''}</span></div>`;
  $('#tree').innerHTML = rec(t, 0);
}
window.openFile = async p => { const [r, d] = await Promise.all([api('/api/files/read?path=' + encodeURIComponent(p)), api('/api/diff?path=' + encodeURIComponent(p))]); $('#fileView').innerHTML = `<div class="row" style="margin-bottom:4px"><span class="mono trunc grow">${esc(p)}</span><button class="btn sm ghost" onclick="nat('reveal', ${JSON.stringify(S.root.replace(/[\\/]$/, '') + '/' + p)})">Explorador</button></div>` + (d.diff ? diffHTML(d.diff) : `<pre class="out sel" style="max-height:420px;overflow:auto">${esc(r.content || r.error || '')}</pre>`); };

// git
async function loadGit() {
  if (!S.root || S.pane !== 'git') return;
  const [d, g] = await Promise.all([api('/api/diff'), api('/api/git', { body: {} })]);
  const el = $('#git');
  if (!d.isGit) { el.innerHTML = '<div class="empty">Esta pasta não é um repositório git.</div>'; return; }
  el.innerHTML = `<div class="row" style="margin-bottom:8px"><b>${esc(g.branch?.trim() || '')}</b><span class="faint">${(d.files || []).length} alteração(ões)</span></div>` +
    (d.files || []).map(f => `<div class="frow" onclick="showDiff('${esc(f.path)}')"><span class="st ${esc(f.status[0])}">${esc(f.status)}</span><span class="trunc grow">${esc(f.path)}</span><button class="btn sm ghost danger" onclick="event.stopPropagation();discard('${esc(f.path)}')" title="Descartar alterações">↺</button></div>`).join('') +
    `<div id="diffView" style="margin-top:8px"></div>` + ((d.files || []).length ? `<div class="row" style="margin-top:10px"><input id="commitMsg" class="grow" placeholder="Mensagem do commit" onkeydown="if(event.key==='Enter')commit()"><button class="btn" onclick="commit()">Commit</button></div>` : '') +
    `<div class="sect">histórico</div><pre class="out sel">${esc(g.log || '')}</pre>`;
}
window.showDiff = async p => { const r = await api('/api/diff?path=' + encodeURIComponent(p)); $('#diffView').innerHTML = `<div class="mono" style="margin-bottom:3px">${esc(p)}</div>` + diffHTML(r.diff || ''); };
window.discard = async p => { if (!confirm(t('Descartar as alterações em ' + p + '?'))) return; await api('/api/git', { body: { action: 'discard', path: p } }); loadGit(); loadTree(); };
window.commit = async () => { const r = await api('/api/git', { body: { action: 'commit', message: $('#commitMsg').value } }); toast(r.ok ? 'Commit feito' : 'Falhou: ' + (r.output || r.error)); loadGit(); };

// tasks
function renderTasks() { const L = cur(); const t = L?.snap?.tasks || []; $('#tasks').innerHTML = t.length ? t.map(x => `<div class="task ${x.status}"><span class="st">${x.status === 'done' ? 'feito' : x.status === 'in_progress' ? 'agora' : 'depois'}</span><span>${esc(x.text)}</span></div>`).join('') : '<div class="empty">O agente ainda não listou tarefas nesta sessão.</div>'; }

// terminal
function renderTerm() { $('#termCwd').textContent = (S.termCwd || S.root || '').replace(S.root, '.') || ''; }
$('#termIn').onkeydown = async e => {
  if (e.key !== 'Enter') return; const c = e.target.value; if (!c.trim()) return; e.target.value = '';
  const t = $('#term'); t.insertAdjacentHTML('beforeend', `<div><span class="cmd">${esc($('#termCwd').textContent)} $ ${esc(c)}</span></div>`); t.scrollTop = t.scrollHeight;
  if (c.trim() === 'clear') { t.innerHTML = ''; return; }
  const r = await api('/api/terminal', { body: { command: c, cwd: S.termCwd } });
  S.termCwd = r.cwd || S.termCwd; renderTerm();
  t.insertAdjacentHTML('beforeend', `<div class="${r.exit ? 'err' : ''}">${esc(r.output || '')}${r.exit ? `\n[exit ${r.exit}]` : ''}</div>` + (r.notes?.length ? `<div class="note">${r.notes.map(esc).join('\n')}</div>` : '')); t.scrollTop = t.scrollHeight; loadGit();
};

// oracle (pronto): files, edited in place, saved as you type
async function loadOracle() {
  const files = await api('/api/oracle'); const el = $('#oracle');
  el.innerHTML = `<div class="faint" style="margin-bottom:8px">Critérios de "pronto". O agente lê; não consegue alterar (qualquer ferramenta, qualquer caminho: bloqueado e registrado).</div>` +
    (files.length ? files : [{ name: 'pronto.md', content: '' }]).map(f => `<div class="row" style="margin:8px 0 4px"><span class="mono">.infuse/oracle/${esc(f.name)}</span><span class="faint" id="osv-${esc(f.name)}"></span></div><textarea class="doc" data-name="${esc(f.name)}" placeholder="Ex.: a página /login autentica com e-mail e senha; o teste e2e login.spec passa; nenhum arquivo acima de 400 linhas.">${esc(f.content)}</textarea>`).join('') +
    `<div class="row" style="margin-top:10px"><input id="newOracle" placeholder="novo arquivo (ex.: performance.md)" onkeydown="if(event.key==='Enter'){api('/api/oracle',{method:'PUT',body:{name:this.value,content:''}}).then(loadOracle)}"></div>`;
  el.querySelectorAll('textarea.doc').forEach(t => { const save = debounce(async () => { await api('/api/oracle', { method: 'PUT', body: { name: t.dataset.name, content: t.value } }); const s = $(`#osv-${t.dataset.name.replace(/\./g, '\\.')}`); if (s) { s.textContent = 'salvo'; setTimeout(() => s.textContent = '', 1200); } }, 500); t.oninput = save; });
}

// rules: inline rows, applied as they change
let rulesState = null;
async function loadRules() {
  const scope = localStorage.getItem('rulesScope') || 'project';
  const r = await api(`/api/rules?scope=${scope}`); rulesState = { scope, rules: r.rules || [], disable: r.disable || [] };
  const el = $('#rules'); const actOf = x => x.replace != null ? 'replace' : x.say ? 'say' : x.infuse ? 'infuse' : x.infuseFile ? 'infuseFile' : x.vice ? 'vice' : 'say';
  el.innerHTML = `<div class="row" style="margin-bottom:6px"><span class="pill"><select id="rulesScope"><option value="project" ${scope === 'project' ? 'selected' : ''}>este projeto</option><option value="global" ${scope === 'global' ? 'selected' : ''}>todos os projetos</option></select></span><span class="faint mono trunc">${esc(r.file)}</span></div>
  <label class="toggle"><input type="checkbox" id="disHd" ${rulesState.disable.includes('heredoc') ? 'checked' : ''}> desligar a transformação de heredoc</label>
  <div class="rule" style="color:var(--text3);font-size:10.5px;text-transform:uppercase"><span></span><span>quando</span><span>casa com (regex)</span><span>ação</span><span>valor</span><span></span></div>
  <div id="ruleRows"></div><button class="btn sm" id="addRule" style="margin-top:6px">+ regra</button>
  <div class="sect">testar um comando</div><div class="row"><input id="testCmd" class="grow mono" placeholder="cat > a.ts <<EOF …" onkeydown="if(event.key==='Enter')testRule()"></div><pre class="out sel" id="testOut" style="display:none"></pre>`;
  const rows = $('#ruleRows');
  const draw = () => { rows.innerHTML = rulesState.rules.map((x, i) => `<div class="rule" data-i="${i}"><input type="checkbox" data-k="enabled" ${x.enabled === false ? '' : 'checked'}><select data-k="when">${['command', 'write', 'list', 'always'].map(w => `<option ${x.when === w ? 'selected' : ''}>${w}</option>`).join('')}</select><input data-k="match" class="mono" value="${esc(x.match || '')}"><select data-k="act">${['say', 'infuse', 'infuseFile', 'replace', 'vice'].map(a => `<option ${actOf(x) === a ? 'selected' : ''}>${a}</option>`).join('')}</select><input data-k="val" value="${esc(x.replace ?? x.say ?? x.infuse ?? x.infuseFile ?? x.vice ?? '')}"><button class="x" data-k="del">×</button></div>`).join(''); };
  draw();
  const save = debounce(async () => { const r = await api(`/api/rules?scope=${rulesState.scope}`, { method: 'PUT', body: { rules: rulesState.rules, disable: $('#disHd').checked ? ['heredoc'] : [] } }); if (r.error) toast(r.error); }, 400);
  rows.oninput = rows.onchange = e => { const row = e.target.closest('.rule'); if (!row) return; const x = rulesState.rules[+row.dataset.i]; const k = e.target.dataset.k;
    if (k === 'enabled') x.enabled = e.target.checked; else if (k === 'when') x.when = e.target.value; else if (k === 'match') x.match = e.target.value;
    else if (k === 'act' || k === 'val') { const act = row.querySelector('[data-k=act]').value, val = row.querySelector('[data-k=val]').value; delete x.replace; delete x.say; delete x.infuse; delete x.infuseFile; delete x.vice; if (act === 'replace') x.replace = val; else x[act] = val; }
    save(); };
  rows.onclick = e => { if (e.target.dataset.k === 'del') { rulesState.rules.splice(+e.target.closest('.rule').dataset.i, 1); draw(); save(); } };
  $('#addRule').onclick = () => { rulesState.rules.push({ id: 'r' + Date.now(), when: 'command', match: '', say: '' }); draw(); save(); };
  $('#disHd').onchange = save; $('#rulesScope').onchange = e => { localStorage.setItem('rulesScope', e.target.value); loadRules(); };
}
window.testRule = async () => { const r = await api('/api/rules/test', { body: { command: $('#testCmd').value } }); const o = $('#testOut'); o.style.display = ''; o.textContent = `COMANDO FINAL:\n${r.finalCommand}\n\nO AGENTE RECEBE:\n${(r.lines || []).join('\n') || '(apenas a saída normal)'}`; };

async function loadJournal() { const l = await api('/api/journal'); $('#journal').innerHTML = l.length ? `<table><tr><th>quando</th><th>tipo</th><th>o quê</th></tr>${l.map(e => `<tr><td class="faint">${when(e.ts)}</td><td><span class="tag ${e.kind === 'blocked' ? 'bad' : ''}">${esc(e.kind)}</span></td><td class="mono cell">${esc(e.path || e.command || '')}${e.detail ? ` <span class="faint">${esc(e.detail)}</span>` : ''}</td></tr>`).join('')}</table>` : '<div class="empty">Nenhuma escrita passou pelo filtro ainda.</div>'; }
async function loadVices() { const l = await api('/api/lessons'); $('#vices').innerHTML = l.length ? `<table><tr><th>quando</th><th>vício</th><th>detalhe</th></tr>${l.map(e => `<tr><td class="faint">${when(e.ts)}</td><td><span class="tag warn">${esc(e.vice)}</span></td><td class="cell">${esc(e.detail)}</td></tr>`).join('')}</table>` : '<div class="empty">Nenhum vício observado.</div>'; }
async function loadMap() {
  if (!S.root) return; const m = await api('/api/map'); const nf = Object.keys(m.files || {}).length;
  const dirs = Object.entries(m.dirs || {}).sort(); $('#map').innerHTML = `<div class="row" style="margin-bottom:8px"><span class="muted">${nf} arquivos · gerado ${when(m.generatedAt)}</span><button class="btn sm" onclick="api('/api/map?refresh=1').then(loadMap)">Regerar</button></div>` +
    ((m.hotspots || []).length ? `<div class="card" style="margin-bottom:10px;border-color:var(--warn)"><b>Arquivos grandes demais</b><ul style="margin:6px 0 0 18px;padding:0">${m.hotspots.map(h => `<li class="mono">${esc(h.path)} — ${h.lines} linhas</li>`).join('')}</ul></div>` : '') +
    `<table><tr><th>pasta</th><th>arquivos</th><th>linhas</th><th>subpastas</th></tr>${dirs.map(([p, d]) => `<tr><td class="mono">${esc(p)}</td><td>${(d.files||[]).length}</td><td>${d.lines||0}</td><td class="cell faint">${esc((d.subdirs||[]).join(', '))}</td></tr>`).join('')}</table>`;
}

// config: inline, applied on change
async function saveSetting(patch) { const r = await api('/api/settings', { method: 'PUT', body: patch }); if (r.error) toast(r.error); S.settings = { ...S.settings, ...patch }; return r; }
async function renderConfig() {
  const r = await api('/api/settings'); S.settings = r.settings; S.providers = r.providers; const s = r.settings; const st = await api('/api/status');
  const el = $('#config');
  el.innerHTML = `<div class="sect">provedor</div>
  <div class="prov"><span class="nm">${esc(s.provider)}</span><span class="tag ${r.hasKey || s.provider === 'mock' ? 'ok' : ''}">${s.provider === 'mock' ? 'demonstração' : r.hasKey ? 'conectado' : 'sem chave'}</span><span class="grow"></span><span class="pill"><select id="c_provider">${r.providers.map(p => `<option ${p === s.provider ? 'selected' : ''}>${p}</option>`).join('')}</select></span></div>
  <div class="inl"><label>Chave de API</label><input type="password" id="c_key" value="${esc(s.apiKey || '')}" placeholder="cole a chave"><button class="btn sm" id="c_test">Testar e salvar</button><span id="c_keyRes" class="faint"></span></div>
  <div class="inl"><label>Endpoint (opcional)</label><input type="text" id="c_base" value="${esc(s.baseUrl || '')}" placeholder="${s.provider === 'ollama' ? 'http://127.0.0.1:11434' : s.provider === 'openai' ? 'https://api.openai.com — ou LM Studio, vLLM, OpenRouter, Groq…' : 'padrão do provedor'}"></div>
  <div class="inl"><label>Modelos disponíveis</label><button class="btn sm" id="c_models">Listar modelos do provedor</button><span id="c_modelsRes" class="faint"></span></div>
  <div id="c_modelList" style="display:flex;gap:4px;flex-wrap:wrap;margin:0 0 6px 148px"></div>
  <div class="inl"><label>Modelo principal</label><input type="text" id="c_model" value="${esc(s.model)}" list="models"></div>
  <div class="inl"><label>Modelo rápido</label><input type="text" id="c_fast" value="${esc(s.fastModel)}" list="models"></div>
  <datalist id="models">${Object.keys(s.pricing || {}).map(m => `<option>${esc(m)}</option>`).join('')}</datalist>
  <div class="inl"><label>Raciocínio (tokens)</label><input type="number" id="c_think" value="${s.thinkingBudget || 0}" min="0" step="1000"><span class="faint">0 desliga</span></div>
  <div class="inl"><label>Máx. tokens de saída</label><input type="number" id="c_max" value="${s.maxTokens}"></div>
  <div class="inl"><label>Limite da sessão (US$)</label><input type="number" id="c_limit" value="${s.dailyLimitUsd}" step="1"></div>
  <div class="sect">preços (US$ por milhão de tokens) — <span class="faint">estimativa; confira a tabela do provedor</span></div>
  <table class="price"><tr><th>prefixo do modelo</th><th>entrada</th><th>saída</th><th></th></tr>${Object.entries(s.pricing || {}).map(([k, v]) => `<tr data-k="${esc(k)}"><td class="mono">${esc(k)}</td><td><input type="number" step="0.01" value="${v[0]}" data-i="0"></td><td><input type="number" step="0.01" value="${v[1]}" data-i="1"></td><td><button class="btn sm ghost" data-del="${esc(k)}">×</button></td></tr>`).join('')}
  <tr><td><input id="p_new" class="mono" placeholder="novo prefixo" style="width:100%"></td><td><input type="number" id="p_in" step="0.01" placeholder="in"></td><td><input type="number" id="p_out" step="0.01" placeholder="out"></td><td><button class="btn sm" id="p_add">+</button></td></tr></table>
  <div class="sect">permissões padrão</div>
  ${['Bash', 'Write', 'Edit', 'WebFetch'].map(t => `<div class="inl"><label>${t}</label><span class="pill"><select data-perm="${t}">${['ask', 'allow', 'deny'].map(v => `<option value="${v}" ${(s.permissions || {})[t] === v ? 'selected' : ''}>${{ ask: 'perguntar', allow: 'permitir', deny: 'negar' }[v]}</option>`).join('')}</select></span></div>`).join('')}
  <div class="inl"><label>Caminhos protegidos</label><input type="text" id="c_prot" value="${esc((s.protectedPaths || []).join(', '))}" placeholder=".infuse/oracle/**, .env"></div>
  <div class="sect">janela</div>
  <div class="inl"><label>Idioma</label><span class="pill"><select id="c_lang"><option value="pt-BR" ${(s.language || 'pt-BR') !== 'en' ? 'selected' : ''}>Português (Brasil)</option><option value="en" ${s.language === 'en' ? 'selected' : ''}>English</option></select></span></div>
  <div class="inl"><label>Tema</label><span class="pill"><select id="c_theme">${['system', 'light', 'dark'].map(t => `<option value="${t}" ${s.theme === t ? 'selected' : ''}>${{ system: 'seguir o sistema', light: 'claro', dark: 'escuro' }[t]}</option>`).join('')}</select></span></div>
  <div class="inl"><label class="toggle"><input type="checkbox" id="c_notify" ${s.notify ? 'checked' : ''}> notificações do sistema</label></div>
  <div class="inl"><label class="toggle"><input type="checkbox" id="c_tray" ${s.hideTray ? '' : 'checked'}> ícone na bandeja</label></div>
  <div class="inl"><label class="toggle"><input type="checkbox" id="c_closeTray" ${s.closeToTray ? 'checked' : ''}> fechar a janela mantém na bandeja</label></div>
  <div class="inl"><label class="toggle"><input type="checkbox" id="c_vim" ${s.vim ? 'checked' : ''}> modo vim na caixa de prompt</label></div>
  <div class="sect">aplicativos nesta máquina</div>
  <div id="c_apps" class="faint">procurando…</div>
  <div class="sect">outros agentes (Claude Code, Codex, Gemini)</div>
  <div class="inl"><span class="muted">shell interposto: </span><span class="tag ${st.shimInstalled ? 'ok' : ''}">${st.shimInstalled ? 'instalado' : 'não instalado'}</span><span class="grow"></span><button class="btn sm" onclick="api('/api/install',{body:{}}).then(r=>{toast(r.error||'Instalado — reinicie o Claude Code');renderConfig()})">Instalar</button><button class="btn sm danger" onclick="api('/api/uninstall',{body:{}}).then(()=>{toast('Removido');renderConfig()})">Remover</button></div>
  <div class="faint mono">${esc(st.shim || '')}</div>`;
  const bind = (id, key, map = v => v) => { el.querySelector(id).onchange = e => saveSetting({ [key]: map(e.target.type === 'checkbox' ? e.target.checked : e.target.value) }).then(() => { if (key === 'theme') applyTheme(); if (key === 'vim') applyVim(); }); };
  bind('#c_provider', 'provider'); bind('#c_base', 'baseUrl'); bind('#c_model', 'model'); bind('#c_fast', 'fastModel'); bind('#c_think', 'thinkingBudget', Number); bind('#c_max', 'maxTokens', Number); bind('#c_limit', 'dailyLimitUsd', Number);
  el.querySelector('#c_lang').onchange = e => saveSetting({ language: e.target.value }).then(() => location.reload());
  bind('#c_theme', 'theme'); bind('#c_notify', 'notify'); bind('#c_tray', 'hideTray', v => !v); bind('#c_closeTray', 'closeToTray'); bind('#c_vim', 'vim'); bind('#c_prot', 'protectedPaths', v => v.split(',').map(x => x.trim()).filter(Boolean));
  el.querySelectorAll('[data-perm]').forEach(sel => sel.onchange = () => saveSetting({ permissions: { ...S.settings.permissions, [sel.dataset.perm]: sel.value } }));
  el.querySelector('#c_provider').onchange = e => saveSetting({ provider: e.target.value }).then(renderConfig);
  el.querySelector('#c_test').onclick = async () => { const k = el.querySelector('#c_key').value; const res = el.querySelector('#c_keyRes'); res.textContent = 'testando…'; const r = await api('/api/settings/test', { body: { apiKey: k } }); if (r.ok) { if (k && !k.includes('…')) await saveSetting({ apiKey: k }); res.innerHTML = `<span class="tag ok">ok</span> ${esc(r.model)}`; renderConfig(); } else res.innerHTML = `<span class="tag bad">falhou</span> ${esc(r.error)}`; };
  el.querySelector('#c_models').onclick = async () => { const res = el.querySelector('#c_modelsRes'); res.textContent = 'consultando…'; const r = await api('/api/providers/models', { body: { provider: el.querySelector('#c_provider').value, apiKey: el.querySelector('#c_key').value, baseUrl: el.querySelector('#c_base').value } });
    if (!r.ok) { res.innerHTML = `<span class="tag bad">falhou</span> ${esc(r.error)}`; return; } res.textContent = `${r.models.length} modelo(s) — clique para usar como principal`;
    el.querySelector('#c_modelList').innerHTML = r.models.map(m => `<button class="btn sm ghost mono" data-m="${esc(m)}">${esc(m)}</button>`).join(''); el.querySelectorAll('#c_modelList button').forEach(b => b.onclick = () => saveSetting({ model: b.dataset.m }).then(() => { toast('Modelo principal: ' + b.dataset.m); renderConfig(); })); };
  api('/api/apps').then(apps => { const box = el.querySelector('#c_apps'); if (!box) return; box.className = ''; box.innerHTML = apps.map(a => `<div class="prov"><span class="nm">${esc(a.name)}</span><span class="tag ${a.found ? 'ok' : ''}">${a.found ? 'encontrado' : 'não encontrado'}</span><span class="faint mono trunc grow">${esc(a.appId || a.path || '')}</span><button class="btn sm" data-app="${a.id}" ${a.found ? '' : 'disabled'}>Abrir</button></div>`).join('');
    box.querySelectorAll('[data-app]').forEach(b => b.onclick = () => api('/api/apps/open', { body: { id: b.dataset.app } }).then(r => toast(r.ok ? 'Abrindo…' : r.error))); });
  const savePrice = () => { const pricing = {}; el.querySelectorAll('tr[data-k]').forEach(tr => pricing[tr.dataset.k] = [+tr.querySelector('[data-i="0"]').value, +tr.querySelector('[data-i="1"]').value]); return saveSetting({ pricing }); };
  el.querySelectorAll('tr[data-k] input').forEach(i => i.onchange = savePrice);
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { b.closest('tr').remove(); savePrice().then(renderConfig); });
  el.querySelector('#p_add').onclick = () => { const k = el.querySelector('#p_new').value.trim(); if (!k) return; saveSetting({ pricing: { ...S.settings.pricing, [k]: [+el.querySelector('#p_in').value, +el.querySelector('#p_out').value] } }).then(renderConfig); };
  fillModels();
}
function fillModels() { const s = S.settings || {}; const set = new Set([s.model, s.fastModel, 'claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5', cur()?.snap?.model].filter(Boolean)); $('#modelSel').innerHTML = [...set].map(m => `<option>${esc(m)}</option>`).join(''); const L = cur(); $('#modelSel').value = L?.snap?.model || s.model; }

// ---------------------------------------------------------------- boot
(async function boot() {
  const r = await api('/api/settings'); S.settings = r.settings; S.providers = r.providers; S.tools = r.tools; S.mode = S.settings.mode; S.lang = (S.settings.language || '').toLowerCase().startsWith('en') ? 'en' : 'pt'; startTranslation(); applyTheme(); applyVim(); renderMode(); fillModels();
  $('#app').classList.toggle('panel', S.panelOpen); showPane(S.pane);
  await loadProjects();
  const saved = JSON.parse(localStorage.getItem('open') || '{"open":[]}');
  for (const t of saved.open) if (S.projects.find(p => p.root === t.root) && (S.sessions[t.root] || []).find(s => s.id === t.id)) S.open.push(t);
  renderTabs();
  if (saved.sid && S.open.find(t => t.id === saved.sid)) { const t = S.open.find(x => x.id === saved.sid); openSession(t.root, t.id); }
  else if (S.open.length) openSession(S.open[0].root, S.open[0].id);
  else if (S.projects.length) { selectProject(S.projects[0].root); renderChat(); }
  else renderChat();
  renderProjPill();
  updateFoot(); P.focus();
  if (window.infuse) infuse.on('drop', r => {});
})();
</script>
